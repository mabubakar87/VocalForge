[pytest]
testpaths = tests
pythonpath = .
markers =
    integration: uses local model/audio fixtures; may be slower
    gpu: requires a working CUDA + CTranslate2 stack
    audio_device: requires a microphone or PortAudio device
    network: requires internet access
    slow: long-running tests
addopts = -q -m "not gpu and not audio_device and not network and not slow"
